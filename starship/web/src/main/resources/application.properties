# Данные достаёт бизнес-компонент через JTA-датасорс сервера, Spring к БД не ходит.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Без этого Spring отдаёт RFC 7807 вместо схемы Error из спецификации.
spring.mvc.problemdetails.enabled=false

# Несуществующий путь должен давать наш JSON, а не HTML-страницу контейнера.
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false

# Пустые поля не сериализуем: в схеме Error поле details необязательное.
spring.jackson.default-property-inclusion=non_null
