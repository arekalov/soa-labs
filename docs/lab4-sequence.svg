<text x="330.0" y="1355" font-size="18" text-anchor="middle" font-weight="normal">18. HTTP 200 + JSON</text>
<text x="1320.0" y="1603" font-size="21" text-anchor="middle" font-weight="normal">Сплошная стрелка — запрос / вызов. Пунктирная — ответ. Узкие полосы — обработка или ожидание ответа.</text>
<text x="1320.0" y="1641" font-size="21" text-anchor="middle" font-weight="normal">REST → SOAP: SoapStarshipClient и CXF формируют XML; StarshipEndpoint передаёт операцию бизнес-компоненту.</text>
<text x="1320.0" y="1679" font-size="21" text-anchor="middle" font-weight="normal">Mule связывает Starship и SpaceMarine. Проверка по HTTP и запись в БД — не распределённая транзакция.</text>
<text x="1320.0" y="1717" font-size="21" text-anchor="middle" font-weight="normal">Показан один выбранный узел Starship. SSH-туннель и Consul опущены. Два блока starship/ejb — классы одного модуля.</text>
