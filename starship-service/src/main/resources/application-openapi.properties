# Профиль только для generateOpenApiDocs: сервис стартует локально, без helios.
server.port=18080
spring.datasource.url=jdbc:h2:mem:openapi;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
soa.spacemarine.base-url=https://localhost:27443
soa.truststore.password=changeit
# Та же версия OpenAPI, что в рукописной спецификации, и без домешивания ответов
# из @ExceptionHandler в каждую операцию.
springdoc.api-docs.version=openapi_3_0
springdoc.override-with-generic-response=false
