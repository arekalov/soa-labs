# Подключение к БД. Значения приходят из окружения (setenv.sh на helios),
# в репозиторий попадают только плейсхолдеры — паролей здесь быть не должно.
spring.datasource.url=${SOA_DB_URL}
spring.datasource.username=${SOA_DB_USER}
spring.datasource.password=${SOA_DB_PASSWORD}

# Схему раскатывает db/schema.sql; Hibernate только сверяет соответствие.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Без этого Spring отдаёт RFC 7807 (application/problem+json) вместо схемы Error из спецификации,
# и «строгое соответствие спецификации» ломается на каждом ответе с ошибкой.
spring.mvc.problemdetails.enabled=false

# Несуществующий путь должен давать наш JSON, а не HTML-страницу Tomcat.
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false

# Пустые поля не сериализуем: в схеме Error поле details необязательное.
spring.jackson.default-property-inclusion=non_null

# Адрес первого сервиса и truststore для обращения к нему по HTTPS
# с самоподписанным сертификатом.
soa.spacemarine.base-url=${SOA_SPACEMARINE_BASE_URL}
soa.truststore.path=${SOA_TRUSTSTORE_PATH}
soa.truststore.password=${SOA_TRUSTSTORE_PASSWORD}
